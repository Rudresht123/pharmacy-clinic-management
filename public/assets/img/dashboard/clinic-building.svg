<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- ground and shadow -->
  <rect x="0" y="154" width="420" height="16" fill="#e2e8f0" opacity=".7"/>
  <ellipse cx="232" cy="156" rx="178" ry="5" fill="#cbd5e1" opacity=".55"/>

  <!-- left wing -->
  <rect x="72" y="70" width="104" height="86" fill="url(#wall)" stroke="#dbe3ef"/>
  <rect x="66" y="64" width="116" height="7" rx="2" fill="#cbd5e1"/>
  <g fill="url(#glass)">
    <rect x="82" y="82" width="84" height="12" rx="1.5"/>
    <rect x="82" y="102" width="84" height="12" rx="1.5"/>
    <rect x="82" y="122" width="84" height="12" rx="1.5"/>
  </g>
  <g stroke="#eff6ff" stroke-width="1">
    <path d="M96 82v12M110 82v12M124 82v12M138 82v12M152 82v12"/>
    <path d="M96 102v12M110 102v12M124 102v12M138 102v12M152 102v12"/>
    <path d="M96 122v12M110 122v12M124 122v12M138 122v12M152 122v12"/>
  </g>

  <!-- right wing -->
  <rect x="318" y="84" width="68" height="72" fill="url(#wall)" stroke="#dbe3ef"/>
  <rect x="313" y="78" width="78" height="7" rx="2" fill="#cbd5e1"/>
  <g fill="url(#glass)">
    <rect x="328" y="96" width="20" height="11" rx="1.5"/>
    <rect x="356" y="96" width="20" height="11" rx="1.5"/>
