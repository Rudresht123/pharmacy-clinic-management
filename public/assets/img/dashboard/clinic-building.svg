  <rect x="45" y="138" width="4" height="18" rx="1" fill="#a16207"/>
  <circle cx="47" cy="126" r="20" fill="url(#leaf)"/>
  <circle cx="33" cy="138" r="12" fill="#22c55e"/>
  <rect x="397" y="134" width="4" height="22" rx="1" fill="#a16207"/>
  <circle cx="399" cy="124" r="15" fill="url(#leaf)"/>
  <ellipse cx="104" cy="154" rx="20" ry="6" fill="#86efac"/>
  <ellipse cx="192" cy="155" rx="14" ry="5" fill="#86efac"/>
  <ellipse cx="300" cy="155" rx="15" ry="5" fill="#86efac"/>
