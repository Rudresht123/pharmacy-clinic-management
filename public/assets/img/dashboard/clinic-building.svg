  <rect x="164" y="20" width="162" height="8" rx="2" fill="#cbd5e1"/>
  <g fill="url(#glass)">
    <rect x="182" y="38" width="20" height="11" rx="1.5"/>
    <rect x="209" y="38" width="20" height="11" rx="1.5"/>
    <rect x="236" y="38" width="20" height="11" rx="1.5"/>
    <rect x="263" y="38" width="20" height="11" rx="1.5"/>
    <rect x="290" y="38" width="20" height="11" rx="1.5"/>
    <rect x="182" y="56" width="20" height="11" rx="1.5"/>
    <rect x="209" y="56" width="20" height="11" rx="1.5"/>
    <rect x="236" y="56" width="20" height="11" rx="1.5"/>
    <rect x="263" y="56" width="20" height="11" rx="1.5"/>
    <rect x="290" y="56" width="20" height="11" rx="1.5"/>
    <rect x="182" y="74" width="20" height="11" rx="1.5"/>
    <rect x="209" y="74" width="20" height="11" rx="1.5"/>
    <rect x="236" y="74" width="20" height="11" rx="1.5"/>
    <rect x="263" y="74" width="20" height="11" rx="1.5"/>
    <rect x="290" y="74" width="20" height="11" rx="1.5"/>
    <rect x="182" y="92" width="20" height="11" rx="1.5"/>
    <rect x="209" y="92" width="20" height="11" rx="1.5"/>
    <rect x="236" y="92" width="20" height="11" rx="1.5"/>
    <rect x="263" y="92" width="20" height="11" rx="1.5"/>
    <rect x="290" y="92" width="20" height="11" rx="1.5"/>
    <rect x="182" y="110" width="20" height="11" rx="1.5"/>
    <rect x="209" y="110" width="20" height="11" rx="1.5"/>
    <rect x="236" y="110" width="20" height="11" rx="1.5"/>
    <rect x="263" y="110" width="20" height="11" rx="1.5"/>
    <rect x="290" y="110" width="20" height="11" rx="1.5"/>
  </g>

  <!-- the sign -->
  <rect x="226" y="4" width="38" height="18" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="242" y="7" width="6" height="12" rx="1" fill="#ef4444"/>
  <rect x="239" y="10" width="12" height="6" rx="1" fill="#ef4444"/>

