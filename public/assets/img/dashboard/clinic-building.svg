  <rect x="210" y="130" width="70" height="6" rx="1.5" fill="#94a3b8"/>
  <rect x="222" y="136" width="46" height="20" fill="url(#door)"/>
  <path d="M245 136v20" stroke="#dbeafe" stroke-width="1.2"/>

