name: 'Platform > Messaging Settings'
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/admin/messaging/{channel}'
    metadata:
      custom: []
      groupName: 'Platform > Messaging Settings'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'What is configured, and what is still missing.'
      description: |-
        Returns the SHAPE of the credentials and never their contents. A secret
        comes back as `is_set: true` and nothing more — an administrator needs
        to know whether a token is present, not what it is, and a secret that
        reaches the browser is a secret in somebody's devtools and browser cache.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      channel:
        custom: []
        name: channel
        description: ''
        required: true
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
