      - POST
    uri: 'api/v1/admin/messaging/{channel}/test'
    metadata:
      custom: []
      groupName: 'Platform > Messaging Settings'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: "Whether the platform's credentials actually work."
      description: |-
        Answers with the normalized result and NOTHING ELSE. A provider's own
        error text is for the server log: a Digiware URL carries its token in
        the query string, and an SMTP failure quotes the transport DSN, which
        carries the password.
      authenticated: true
      deprecated: false
