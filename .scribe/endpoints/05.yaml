    custom: []
    httpMethods:
      - PUT
    uri: 'api/v1/admin/messaging/{channel}'
    metadata:
      custom: []
      groupName: 'Platform > Messaging Settings'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Save the provider and its credentials.'
      description: |-
        A blank secret MEANS "leave it alone". Without that rule, opening this
        screen to correct a host name and saving would wipe the password, and
        every clinic on the platform would stop sending at once.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
